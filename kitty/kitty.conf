# Polished macOS Kitty configuration
# Keeps the existing Catppuccin theme and window shortcuts while adopting
# Maple Mono, smoother cursor/scrolling, secure remote control, and split navigation.

include current-theme.conf

# Typography
font_family Maple Mono NF CN
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0
modify_font cell_height 108%
disable_ligatures cursor
text_composition_strategy platform

# Cursor
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.4

# Scrolling
scrollback_lines 20000
touch_scroll_multiplier 3.0
wheel_scroll_multiplier 6.0
wheel_scroll_min_lines 1

# Window appearance
hide_window_decorations titlebar-only
window_padding_width 10 12
placement_strategy center
remember_window_size yes
initial_window_width 120c
initial_window_height 34c
background_opacity 0.82
dynamic_background_opacity yes
background_blur 30
inactive_text_alpha 0.75
macos_titlebar_color background
confirm_os_window_close 0

# Tabs and splits
enabled_layouts splits,stack
tab_bar_edge top
tab_bar_min_tabs 2
tab_bar_style powerline
tab_powerline_style slanted
tab_title_max_length 28
active_tab_font_style bold
inactive_tab_font_style normal

# Rendering and terminal behavior
repaint_delay 6
input_delay 0
sync_to_monitor yes
shell_integration enabled
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
strip_trailing_spaces smart
detect_urls yes
url_style single
term xterm-kitty

# Cap tode/terminal-browser frame size. A full-frame retransmit at native 4K
# retina (~33MB RGBA) once wedged kitty inside the macOS GL->Metal texture
# upload (glTexImage2D uninterruptible, whole desktop stalled). 4.5M pixels
# ~= renderScale 1.5 on this display, ~18MB frames. Raise/lower to taste.
env TERMINAL_BROWSER_MAX_PIXELS=4500000

# Secure remote control: accept socket requests, reject TTY requests
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

# macOS behavior
# Keep only the left Option key as Alt so the right Option key can still type symbols.
macos_option_as_alt left
macos_quit_when_last_window_closed yes

# Tabs/windows inherit the current working directory
map cmd+t new_tab_with_cwd
map cmd+n new_os_window_with_cwd
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current

# Navigate splits with Cmd+Arrow; retain the previous Cmd+Option+Arrow bindings
map cmd+left neighboring_window left
map cmd+right neighboring_window right
map cmd+up neighboring_window top
map cmd+down neighboring_window bottom
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window top
map cmd+alt+down neighboring_window bottom

# Fast page scrolling
map shift+cmd+up scroll_page_up
map shift+cmd+down scroll_page_down

# Tab navigation
map cmd+shift+left previous_tab
map cmd+shift+right next_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

map cmd+k clear_terminal to_cursor active
include tode/keybinds.kitty.conf
