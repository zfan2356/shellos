# Canonical dsh user settings. The remote installer copies this to
# $DSH_HOME/settings.yaml on every reinstall (repo state is decisive).
# Secrets never live here: DEEPSEEK_API_KEY stays in $DSH_HOME/.env.
# User DSH settings. Catalog and default model overlay the 0.1.0-rc.6 composition.
llm-deepseek:
  models:
    - id: deepseek-flash
      name: DeepSeek V4.1 Flash
      description: Official DeepSeek-V4.1-Flash (native multimodal)
      inputModalities: [ text, image ]
    - id: deepseek-v4-pro
      name: DeepSeek V4 Pro
      description: V4 Pro; routes to V4.1 Flash after 2026-09-14 until V4.1 Pro ships
      inputModalities: [ text ]

agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
dsh-tui:
  diffLayout: unified
